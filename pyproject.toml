[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meetrec"
version = "0.1.0"
description = "Personal meeting recorder: mic + system audio (device level), per-speaker timeline with overlap"
requires-python = ">=3.11"
dependencies = [
    "numpy", "sherpa-onnx", "certifi", "soundfile", "soxr", "soundcard", "PySide6",
    "catap; sys_platform == 'darwin'", "pyobjc-framework-Quartz; sys_platform == 'darwin'",
]

[project.optional-dependencies]
transcribe = ["faster-whisper", "av<17"]

[project.scripts]
meetrec = "meetrec.cli:main"

[project.gui-scripts]
meetrec-ui = "meetrec.ui:run"

[tool.setuptools.packages.find]
where = ["src"]
